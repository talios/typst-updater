[tools]
# Provides `cargo upgrade` for bumping version requirements in Cargo.toml
"cargo:cargo-edit" = "latest"
# Provides `sbot` for deriving release and snapshot versions from git tags
"github:restechnica/semverbot" = "1.7.2"

[tasks.update]
description = "Upgrade dependencies in Cargo.toml and refresh Cargo.lock"
run = [
  "cargo upgrade --incompatible",
  "cargo update",
]

[tasks.fmt]
description = "Format sources with rustfmt"
run = "cargo fmt"
sources = ["src/**/*.rs"]
outputs = { auto = true }

[tasks.test]
description = "Run the test suite"
# Format first so tests never compile sources that rustfmt is rewriting
depends = ["fmt"]
run = "cargo test"
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs"]
outputs = { auto = true }

[tasks.build]
description = "Build a release binary"
depends = ["fmt", "test"]
# cargo resets the binary's mtime (no-op builds, `cargo install` re-linking it), so track a stamp file instead
run = ["cargo build --release", "touch target/release/.mise-build-stamp"]
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs"]
outputs = ["target/release/.mise-build-stamp"]

[tasks.install]
description = "Install typst-updater into ~/.cargo/bin"
depends = ["build"]
run = [
  "cargo install --path . --locked",
  "touch {{env.HOME}}/.cargo/bin/typst-updater",
]
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs"]
outputs = ["{{env.HOME}}/.cargo/bin/typst-updater"]

[tasks.version]
description = "Print the current released version and the predicted next version"
run = [
  "echo current: $(sbot get version)",
  "echo next:    $(sbot predict version)",
]

[tasks.release]
description = "Tag the predicted next version and push the tag, triggering a release build"
depends = ["test"]
run = [
  "sbot release version",
  "sbot push version",
]
