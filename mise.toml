[tools]
# Provides `cargo upgrade` for bumping version requirements in Cargo.toml
"cargo:cargo-edit" = "latest"
# Provides `sbot` for deriving release and snapshot versions from git tags
"github:restechnica/semverbot" = "1.7.2"
# Builds the Astro documentation site in docs/
node = "24"

[tasks.update]
description = "Upgrade dependencies in Cargo.toml and refresh Cargo.lock"
run = [
  "cargo upgrade --incompatible",
  "cargo update",
]

[tasks.fmt]
description = "Format sources with rustfmt"
run = "cargo fmt --all"
sources = ["src/**/*.rs", "tools/*/src/**/*.rs"]
outputs = { auto = true }

[tasks.test]
description = "Run the test suite"
# Format first so tests never compile sources that rustfmt is rewriting
depends = ["fmt"]
run = "cargo test --workspace"
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs", "tools/*/Cargo.toml", "tools/*/src/**/*.rs"]
outputs = { auto = true }

[tasks.build]
description = "Build a release binary"
depends = ["fmt", "test"]
# cargo resets the binary's mtime (no-op builds, `cargo install` re-linking it), so track a stamp file instead
run = ["cargo build --release", "touch target/release/.mise-build-stamp"]
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs"]
outputs = ["target/release/.mise-build-stamp"]

[tasks.install]
description = "Install typst-updater into ~/.cargo/bin"
depends = ["build"]
run = [
  "cargo install --path . --locked",
  "touch {{env.HOME}}/.cargo/bin/typst-updater",
]
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs"]
outputs = ["{{env.HOME}}/.cargo/bin/typst-updater"]

[tasks.version]
description = "Print the current released version and the predicted next version"
run = [
  "echo current: $(sbot get version)",
  "echo next:    $(sbot predict version)",
]

[tasks.release]
description = "Tag the predicted next version and push the tag, triggering a release build"
depends = ["test"]
run = [
  "sbot release version",
  "sbot push version",
]

[tasks."docs:install"]
description = "Install the documentation site's npm dependencies"
dir = "docs"
# The only install script is fsevents' node-gyp build, and it ships a prebuilt binary
run = "npm ci --ignore-scripts"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."docs:examples"]
description = "Generate the documentation examples and terminal output from src/main.rs"
run = "cargo run --quiet --locked -p docs-examples"
sources = ["src/main.rs", "Cargo.toml", "Cargo.lock", "tools/docs-examples/Cargo.toml", "tools/docs-examples/src/**/*.rs"]
outputs = ["docs/src/data/examples.json", "docs/src/data/terminal.json"]

[tasks.docs]
description = "Generate the documentation site into docs/dist"
depends = ["docs:install", "docs:examples"]
dir = "docs"
run = "npm run build"

[tasks."docs:dev"]
description = "Serve the documentation site locally with live reload"
depends = ["docs:install", "docs:examples"]
dir = "docs"
run = "npm run dev"
