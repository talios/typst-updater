name: docs

# Builds the Astro site in docs/ and publishes it to GitHub Pages. The examples and
# terminal output on the site are generated from src/main.rs by tools/docs-examples,
# so changes there rebuild it too.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight Pages deployment; let the latest queued run follow it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools/docs-examples builds with the runner's preinstalled Rust toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # Skip the rest of mise.toml (cargo-edit compiles from source)
          install_args: node

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        env:
          # Only node (plus the runner's Rust) is needed; don't pull in the rest of mise.toml
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
