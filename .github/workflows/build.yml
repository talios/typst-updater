name: build

# Pushing to main publishes a rolling `snapshot` prerelease; pushing a `v*`
# tag (e.g. via `mise run release`) publishes a versioned release.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sbot derives versions from the tag history
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # Skip the rest of mise.toml (cargo-edit compiles from source)
          install_args: github:restechnica/semverbot

      - id: version
        name: Determine version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$(sbot get version)"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version semverbot reports (v$version)"
              exit 1
            fi
          else
            version="$(sbot predict version)-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "Building $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Stamp version into Cargo.toml
        run: |
          # Only the first match, the [package] version; perl behaves the same on every runner
          perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Build
        run: cargo build --release --target "$TARGET"

      - name: Package
        run: |
          name="typst-updater-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/typst-updater.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/typst-updater" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish snapshot
        if: github.ref_type == 'branch'
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot $VERSION" \
            --notes "Development build of $GITHUB_SHA from main. Replaced on every push."
