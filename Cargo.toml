[package]
name = "typst-updater"
version = "0.1.0"
edition = "2024"

[workspace]
# Helpers that support the project but are never shipped; `cargo build` at the root only builds typst-updater
members = ["tools/docs-examples"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
